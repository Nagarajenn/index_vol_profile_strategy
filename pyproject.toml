[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-profile-core"
version = "0.1.0"
description = "Shared analytics/config core, reused by the ingestion pipeline (Python 3.13) and the dashboard backend (Python 3.14) as an editable install."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "python-dotenv",
    "truststore",
]

[tool.setuptools]
packages = ["analytics", "analytics.volume_intelligence", "config", "live_trading",
            "market_transition", "option_chain", "option_risk_12b", "paper_trading", "pipeline",
            "position_sim_12c", "scalp_decision_12c", "signal_learning_12d"]
